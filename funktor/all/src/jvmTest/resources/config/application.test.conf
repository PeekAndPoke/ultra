ktor {
  development = false

  environment {
    development = false
  }

  deployment {
    environment = "test"
    host = 127.0.0.1
    port = 8080

    shutdownGracePeriod = 50
    shutdownTimeout = 100

    autoreload = false
  }

  application {
    id = "Funktor-All | Test"
    modules = [io.peekandpoke.funktor.ServerKt.module]
  }
}

funktor {
  auth {
    jwt {
      issuer = ${ktor.application.id}
      audience = "api"
      # Test-only, and deliberately self-describing rather than a random-looking blob: this file
      # is a jvmTest resource that never ships, hermetic tests need a fixed key, and anyone
      # reading it should see at a glance that it is not a credential. 73 bytes, over the
      # RFC 7518 floor of 64.
      keys = [
        { id = "test-1", secret = "funktor-all-test-only-signing-key-do-not-use-anywhere-else-0123456789!!!!", alg = "HS512", issued = "2026-08-01" }
      ]
      permissionsNs = "permissions"
      userNs = "user"
    }
  }

  vault {
    profile = false
    explain = false
  }
}
