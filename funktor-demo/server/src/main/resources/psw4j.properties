# Password4j configuration.
#
# Present only to silence a startup/per-hash WARN. Password4j's SaltGenerator reads
# `global.salt.length`; with no `psw4j.properties` on the classpath it falls back to 64 and logs
#
#   "Global salt length is not defined in properties file. Default value is used (64).
#    Please set property global.salt.length in your psw4j.properties file."
#
# once PER HASH — so seeding fixtures prints it for every user.
#
# The value below is DELIBERATELY the same 64 that the fallback already used, so this changes no
# behaviour whatsoever: it only states the choice explicitly. 64 random bytes from SecureRandom is
# 4x the >=16 bytes OWASP and the Argon2 spec call for, so lowering it would be a downgrade for no
# benefit. Do not "tidy" this to 16/32 without a reason.
#
# Only Argon2 reads this. `Argon2Function` generates a salt via `SaltGenerator.generate()` when none
# is supplied, which is our path (`Argon2PasswordHasher` -> `Password.hash(pw).with(argon2)`), and
# Argon2id is the primary hasher in `CompoundPasswordHasher.default`. `BcryptFunction` never touches
# it — bcrypt derives its own 16-byte salt inside the algorithm.
#
# This lives in the APPLICATION, not in `ultra:security`. Shipping a psw4j.properties inside the
# library would silently impose this config on every downstream consumer; picking password4j settings
# is the application's call.
#
# Changing the length later is safe for existing hashes: the Argon2 encoded hash embeds its own salt,
# so stored passwords keep verifying — only newly created hashes would use the new length.
global.salt.length=64
