include required("application.common.conf")

# NO `include "dev.overrides.conf"` here, deliberately.
#
# That file is a developer-local, gitignored override read by application.dev.conf. The test suite is
# DESTRUCTIVE — `AppSpec.beforeSpec` clears fixtures before every spec — so if anyone put
# `arangodb.database` or `mongodb.database` into their own overrides, a test run would silently point
# back at their dev database and wipe it. That has already happened once. Tests stay hermetic: they
# read only committed config.

ktor {
  development = false

  environment {
    development = false
  }

  deployment {
    environment = "test"
    host = 127.0.0.1
    port = 8080

    shutdownGracePeriod = 50
    shutdownTimeout = 100

    autoreload = false
  }

  application {
    id = "Funktor-Demo | Test"
  }
}

funktor {
  auth {
    jwt {
      signingKey = "ka2fEBWhmjPFpaPhg5Iir6tAX1COT0lGNKbD3L5SqP1WecegFVr8vduPy5CdeVNmNQ0oo7b1LgeiNomzLLy51Yt7CW320q8df6Je9ULtkgnPvZ0fpovQmz0spYJCuYFKYxNkFuO5B214or6IEXDs7M3szXZD9taqTspW8jR6plA="
    }
    baseUrls {
      admin = "http://admin.funktor-demo.localhost:36588"
      ops = "http://ops.funktor-demo.localhost:36590"
      b2b = "http://b2b.funktor-demo.localhost:36591"
      b2b2c = "http://b2b2c.funktor-demo.localhost:36592"
    }
  }

  vault {
    profile: false
    explain: false
  }
}

admin {
  baseUrl = "http://admin.funktor-demo.localhost:36588"
}

api {
  baseUrl = "http://api.funktor-demo.localhost:8080"
  insights {
    enabled = true
  }
}

arangodb {
  user: "root"
  password: ""
  host: "localhost"
  port: 8529
  # MUST EXIST BEFORE THE FIRST TEST RUN — create it by hand (or in CI setup):
  #   arangosh --server.database _system --javascript.execute-string \
  #     'db._createDatabase("funktor-demo-test");'
  # Karango creates COLLECTIONS and indexes itself (`ensureRepositories` / `recreateIndexes`) but never
  # a DATABASE, so a missing one surfaces as an opaque Arango 1228. MongoDB needs no such step — it
  # creates a database on first write.
  database: "funktor-demo-test"
}

mongodb {
  connectionString = "mongodb://root:root@localhost:27017"
  database = "funktor-demo-test"
}
